<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Text Extractor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="18" height="18" rx="4" stroke="#7fff00" stroke-width="1.8"/>
          <line x1="6" y1="7.5" x2="16" y2="7.5" stroke="#7fff00" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="6" y1="11" x2="16" y2="11" stroke="#7fff00" stroke-width="1.6" stroke-linecap="round"/>
          <line x1="6" y1="14.5" x2="12" y2="14.5" stroke="#7fff00" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="title-block">
        <h1>Text Extractor</h1>
        <span class="subtitle">Current page</span>
      </div>
    </header>

    <div class="status-card" id="statusCard">
      <div class="status-icon" id="statusIcon">
        <!-- svg 1 (+) -->
        <svg id="iconIdle" width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="12" stroke="#7fff00" stroke-width="1.8" stroke-dasharray="4 2"/>
          <path d="M10 14h8M14 10v8" stroke="#7fff00" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <!-- svg 2 (tick) -->
        <svg id="iconSuccess" class="hidden" width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="12" fill="#7fff00" stroke="#7fff00" stroke-width="1.8"/>
          <path d="M9 14.5l3.5 3.5 6.5-7" stroke="#7fff00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <!-- svg 3 (X) -->
        <svg id="iconError" class="hidden" width="28" height="28" viewBox="0 0 28 28" fill="none">
          <circle cx="14" cy="14" r="12" fill="#7fff00" stroke="#7fff00" stroke-width="1.8"/>
          <path d="M10 10l8 8M18 10l-8 8" stroke="#7fff00" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <p class="status-text" id="statusText">Ready to extract text from this page.</p>
    </div>

    <div class="meta-row hidden" id="metaRow">
      <div class="meta-pill" id="wordCount">
        <span class="meta-label">Words</span>
        <span class="meta-value" id="wordCountVal">—</span>
      </div>
      <div class="meta-pill" id="charCount">
        <span class="meta-label">Chars</span>
        <span class="meta-value" id="charCountVal">—</span>
      </div>
      <div class="meta-pill" id="lineCount">
        <span class="meta-label">Lines</span>
        <span class="meta-value" id="lineCountVal">—</span>
      </div>
    </div>

    <button class="extract-btn" id="extractBtn">
      <span class="btn-content" id="btnContent">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M9 2v10M5 8l4 4 4-4" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 14h12" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Extract &amp; Download
      </span>
      <span class="btn-loading hidden" id="btnLoading">
        <span class="spinner"></span>
        Extracting…
      </span>
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
